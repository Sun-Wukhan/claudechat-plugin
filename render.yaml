# Render Blueprint — one free web service for the ClaudeChat shared stories server.
# Render injects PORT automatically; server/server.js reads process.env.PORT
# and binds 0.0.0.0. The server is zero-dependency, so there is no build step.
# Players get: https://devsnap-lozv.onrender.com (the URL Render assigned) —
# GET / serves the ClaudeChat UI, /api/feed is the shared story feed.
# Free plan caveat: the service sleeps when idle, so the first request after
# a quiet period waits for a cold start. Stories are MVP file storage and
# can be lost on redeploy/restart — acceptable for 2-hour ephemeral stories.
services:
  - type: web
    name: devsnap
    env: node
    plan: free
    buildCommand: 'echo "ClaudeChat - no build step (zero dependencies)"'
    startCommand: node server/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
